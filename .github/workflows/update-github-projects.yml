name: Update GitHub projects

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch portfolio repositories
        env:
          GITHUB_OWNER: garethltm
          PORTFOLIO_TOPIC: portfolio
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-projects.js

      - name: Commit and publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-projects.js
          if git diff --staged --quiet; then
            echo "No project changes."
          else
            git commit -m "chore: update GitHub projects"
            git push
          fi
