<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="instructions-container">
      <div class="instructions">
        <h3>How to Explore</h3>
        <div class="instruction-step">
          <div class="icon">↔</div>
          <p>Move your mouse across the orbital rings</p>
        </div>
        <div class="instruction-step">
          <div class="icon">↙</div>
          <p>Drift towards the center to reveal more focused information</p>
        </div>
        <div class="instruction-step">
          <div class="icon">🔍</div>
          <p>
            Hover to discover details about Skills, Experience, and Education
          </p>
        </div>
        <div class="instruction-tip">
          <strong>Tip:</strong> No clicking required - just move your mouse!
        </div>
      </div>
    </div>
    <div class="center">
      <h2>Gareth</h2>
    </div>
    <div class="orbit-container">
      <div class="orbit orbit1">
        <div class="orbit-name">Skills</div>
        <div class="dot" data-description="My Skills"></div>
      </div>
      <div class="orbit orbit2">
        <div class="orbit-name">Experience</div>
        <div class="dot" data-description="My Experiences"></div>
      </div>
      <div class="orbit orbit3">
        <div class="orbit-name">Education</div>
        <div class="dot" data-description="My Education"></div>
      </div>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <div class="info-box" id="infoBox"></div>
    <script src="script.js"></script>
  </body>
</html>
